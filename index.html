<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireFlow AI - 채용 관리 시스템 (ATS)</title>
    <script src="https://cdn.tailwindcss.Scom"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- 사이드바 -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
            <div class="p-5 flex items-center space-x-3 border-b border-slate-800">
                <div class="bg-indigo-600 p-2 rounded-lg"><i class="fa-solid fa-robot text-white text-xl"></i></div>
                <span class="text-xl font-bold tracking-tight">HireFlow AI</span>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <a href="#" class="flex items-center space-x-3 px-4 py-3 bg-indigo-600 text-white rounded-xl font-medium"><i class="fa-solid fa-chart-pie w-5"></i><span>대시보드</span></a>
                <a href="#" class="flex items-center space-x-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium"><i class="fa-solid fa-users w-5"></i><span>지원자 관리</span></a>
                <a href="#" class="flex items-center space-x-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium"><i class="fa-solid fa-brain w-5"></i><span>AI 매칭 분석</span></a>
            </nav>
        </aside>

        <!-- 메인 콘텐츠 -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8">
                <h1 class="text-xl font-bold text-slate-800">지원자 파이프라인</h1>
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i><span>지원자 등록</span>
                </button>
            </header>

            <div class="p-8">
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                    <h2 class="text-lg font-bold mb-4">등록된 지원자 목록</h2>
                    <div id="applicantList" class="space-y-3">
                        <!-- 동적 로드 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 등록 모달 -->
    <div id="applicantModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-lg font-bold mb-1">AI 이력서 파서 및 지원자 등록</h3>
            <p class="text-xs text-slate-500 mb-4">PDF 이력서를 업로드하면 제미나이가 자동으로 정보를 추출합니다.</p>
            
            <div class="border-2 border-dashed border-indigo-200 bg-indigo-50/50 rounded-xl p-6 text-center mb-4 cursor-pointer hover:bg-indigo-50 transition" onclick="document.getElementById('pdfInput').click()">
                <input type="file" id="pdfInput" accept=".pdf" class="hidden" onchange="handlePdfUpload(event)">
                <i class="fa-solid fa-file-arrow-up text-indigo-500 text-3xl mb-2"></i>
                <p id="uploadStatusText" class="text-sm font-medium text-slate-700">PDF 파일을 여기에 드래그하거나 클릭하여 업로드</p>
            </div>

            <form id="applicantForm" onsubmit="saveApplicant(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">지원 포지션</label>
                    <select id="position" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500">
                        <option>시니어 풀스택 엔지니어</option>
                        <option>프론트엔드 개발자</option>
                        <option>백엔드 개발자</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">지원자 성명</label>
                    <input type="text" id="name" required class="w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500" placeholder="홍길동">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">이메일 주소</label>
                        <input type="email" id="email" required class="w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500" placeholder="name@example.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">연락처</label>
                        <input type="text" id="phone" required class="w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500" placeholder="010-0000-0000">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">경력 요약 및 주요 역량</label>
                    <textarea id="summary" rows="3" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500" placeholder="AI가 이력서 내용을 요약합니다."></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50">취소</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-sm">지원자 등록 완료</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 🔑 여기에 본인의 제미나이 API 키를 입력하세요!
        const apiKey = "AQ.Ab8RN6InTtnbnzhL_h8sOSaGrjYbG2ocbdSJdE6AmVBh-OcEBQ";

        let applicants = JSON.parse(localStorage.getItem('applicants') || '[]');

        function renderApplicants() {
            const list = document.getElementById('applicantList');
            if (applicants.length === 0) {
                list.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">등록된 지원자가 없습니다.</p>';
                return;
            }
            list.innerHTML = applicants.map((app, index) => `
                <div class="border border-slate-200 rounded-xl p-4 flex items-center justify-between bg-white shadow-xs">
                    <div>
                        <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">${app.position}</span>
                        <h4 class="font-bold text-slate-800 mt-1">${app.name} <span class="text-xs font-normal text-slate-500">(${app.email})</span></h4>
                        <p class="text-xs text-slate-600 mt-1">${app.summary}</p>
                    </div>
                    <button onclick="deleteApplicant(${index})" class="text-slate-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function openModal() { document.getElementById('applicantModal').classList.remove('hidden'); document.getElementById('applicantModal').classList.add('flex'); }
        function closeModal() { document.getElementById('applicantModal').classList.add('hidden'); document.getElementById('applicantModal').classList.remove('flex'); }

async function handlePdfUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (apiKey === "YOUR_GEMINI_API_KEY" || !apiKey) {
        alert("API 키가 설정되지 않았습니다. 코드 내 apiKey 변수에 올바른 키를 입력해주세요.");
        return;
    }

    document.getElementById('uploadStatusText').innerText = "Gemini AI가 이력서를 분석하고 있습니다...";

    try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = "";

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            fullText += textContent.items.map(item => item.str).join(' ') + "\n";
        }

        const promptText = `다음 이력서 텍스트를 분석하여 JSON 형식으로 이름(name), 이메일(email), 연락처(phone), 경력요약(summary)을 추출해줘. 반드시 백틱이나 markdown 없이 순수 JSON 형태로만 출력해줘.\n\n이력서 내용:\n${fullText}`;

        // 🎯 핵심 변경: 브라우저 직접 호출 대신 CORS 프록시 중계 서버를 통하여 요청
        const targetUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
        
        const response = await fetch(`https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: promptText }]
                }]
            })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || "API 요청 실패");

        const rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsedData = JSON.parse(rawText);

        if (parsedData.name) document.getElementById('name').value = parsedData.name;
        if (parsedData.email) document.getElementById('email').value = parsedData.email;
        if (parsedData.phone) document.getElementById('phone').value = parsedData.phone;
        if (parsedData.summary) document.getElementById('summary').value = parsedData.summary;

        document.getElementById('uploadStatusText').innerText = "PDF 분석 완료! 내용을 확인 후 등록해주세요.";
    } catch (error) {
        console.error("Gemini Parse Error:", error);
        alert("PDF 파싱 중 오류가 발생했습니다. 직접 입력해주세요.");
        document.getElementById('uploadStatusText').innerText = "PDF 파일을 여기에 드래그하거나 클릭하여 업로드";
    }
}
        function saveApplicant(event) {
            event.preventDefault();
            const newApp = {
                position: document.getElementById('position').value,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                summary: document.getElementById('summary').value
            };
            applicants.push(newApp);
            localStorage.setItem('applicants', JSON.stringify(applicants));
            renderApplicants();
            closeModal();
            document.getElementById('applicantForm').reset();
        }

        function deleteApplicant(index) {
            applicants.splice(index, 1);
            localStorage.setItem('applicants', JSON.stringify(applicants));
            renderApplicants();
        }

        renderApplicants();
    </script>
</body>
</html>
